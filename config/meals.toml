[[recipes]]
title = "Smoky chicken with creamy red lentils and roasted carrots"
titles = {en="Smoky chicken with creamy red lentils and roasted carrots", cs="Kuře s uzenou paprikou, krémovou červenou čočkou a pečenou mrkví"}
translated_steps = {en=["Peel and chop the carrots and onion. Cut the plain chicken breast into strips. Use only dairy-free ingredients; check any seasoning blend's label.", "Toss the carrots with half the oil, salt, cumin and smoked paprika. Roast at 210 °C until browned and tender, about 20–25 minutes.", "Soften the onion in the remaining oil. Stir in the rinsed dry red lentils, paprika and about 250 ml water per serving. Simmer 12–18 minutes until soft; add water as needed. Mash lightly for a creamy texture without dairy.", "Season the chicken with paprika, pepper and salt. Brown it in a nonstick pan and cook through. Spoon the lentils onto a plate, top with chicken and carrots. Optional pantry vinegar adds brightness; no cream or butter."], cs=["Oloupejte a nakrájejte mrkev a cibuli. Neochucená kuřecí prsa nakrájejte na proužky. Používejte suroviny bez mléka a ověřte etiketu kořenicí směsi.","Mrkev promíchejte s polovinou oleje, solí, římským kmínem a uzenou paprikou. Pečte při 210 °C asi 20–25 minut doměkka a dozlatova.","Na zbývajícím oleji změkněte cibuli. Přidejte propláchnutou suchou červenou čočku, papriku a asi 250 ml vody na porci. Vařte 12–18 minut doměkka, podle potřeby dolévejte vodu. Lehce rozmačkejte pro krémovou konzistenci bez mléka.","Kuře osolte a okořeňte paprikou a pepřem. Opečte na nepřilnavé pánvi a důkladně propečte. Podávejte s čočkou a mrkví. Volitelně přidejte trochu octa ze zásob; nepoužívejte smetanu ani máslo."]}
minutes = 35
grams = {chicken="300", lentils="80", carrot="200", onion="50", oil="10"}
steps = [
  "Peel and chop the carrots and onion. Cut the plain chicken breast into strips. Use only dairy-free ingredients; check any seasoning blend's label.",
  "Toss the carrots with half the oil, salt, cumin and smoked paprika. Roast at 210 °C until browned and tender, about 20–25 minutes.",
  "Soften the onion in the remaining oil. Stir in the rinsed dry red lentils, paprika and about 250 ml water per serving. Simmer 12–18 minutes until soft; add water as needed. Mash lightly for a creamy texture without dairy.",
  "Season the chicken with paprika, pepper and salt. Brown it in a nonstick pan and cook through. Spoon the lentils onto a plate, top with chicken and carrots. Optional pantry vinegar adds brightness; no cream or butter.",
]

[[recipes]]
title = "Paprika chicken and red lentil skillet"
titles = {en="Paprika chicken and red lentil skillet", cs="Kuřecí pánev s paprikou a červenou čočkou"}
translated_steps = {en=["Peel and chop the onion and carrots. Slice plain chicken breast and rinse the dry lentils. Choose dairy-free seasonings.", "Brown the chicken in the oil with smoked paprika, salt and pepper. Remove it to a plate.", "Soften the onion and carrots in the pan, then add the lentils and about 250 ml water per serving. Simmer until tender, adding water as needed.", "Return the chicken and finish cooking it through. Adjust salt and pepper and serve; optional pantry vinegar brightens the lentils."], cs=["Oloupejte a nakrájejte cibuli a mrkev. Nakrájejte neochucená kuřecí prsa a propláchněte suchou čočku. Používejte koření bez mléka.","Kuře opečte na oleji s uzenou paprikou, solí a pepřem. Odložte na talíř.","Na pánvi změkněte cibuli a mrkev, přidejte čočku a asi 250 ml vody na porci. Vařte doměkka a podle potřeby dolévejte vodu.","Vraťte kuře a důkladně ho propečte. Dochuťte solí a pepřem a podávejte; volitelně přidejte ocet ze zásob."]}
minutes = 30
grams = {chicken="250", lentils="80", carrot="200", onion="50", oil="10"}
steps = [
  "Peel and chop the onion and carrots. Slice plain chicken breast and rinse the dry lentils. Choose dairy-free seasonings.",
  "Brown the chicken in the oil with smoked paprika, salt and pepper. Remove it to a plate.",
  "Soften the onion and carrots in the pan, then add the lentils and about 250 ml water per serving. Simmer until tender, adding water as needed.",
  "Return the chicken and finish cooking it through. Adjust salt and pepper and serve; optional pantry vinegar brightens the lentils.",
]

[[recipes]]
