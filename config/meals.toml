[[recipes]]
title = "Savory chicken oat porridge"
titles = {en="Savory chicken oat porridge", cs="Slaná ovesná kaše s kuřetem"}
translated_steps = {en=["Peel and grate the carrot and chop the onion. Slice plain chicken breast into thin strips.", "Soften the onion and carrot in the oil, add the chicken and cook through with salt, pepper and paprika.", "Stir in plain dry oat flakes and about 200 ml water per serving. Simmer until creamy, adding water as needed; use water rather than milk.", "Serve as a savory breakfast bowl. Use dairy-free seasonings and no butter or cream."], cs=["Oloupejte a nastrouhejte mrkev a nakrájejte cibuli. Neochucená kuřecí prsa nakrájejte na tenké proužky.","Na oleji změkněte cibuli a mrkev, přidejte kuře, sůl, pepř a papriku a důkladně propečte.","Vmíchejte neochucené suché ovesné vločky a asi 200 ml vody na porci. Vařte do krémové konzistence a podle potřeby dolévejte vodu; místo mléka použijte vodu.","Podávejte jako slanou snídaňovou kaši. Používejte koření bez mléka a nepřidávejte máslo ani smetanu."]}
meal_style = "breakfast"
minutes = 20
grams = {chicken="160", oats="50", carrot="80", onion="30", oil="5"}
steps = [
  "Peel and grate the carrot and chop the onion. Slice plain chicken breast into thin strips.",
  "Soften the onion and carrot in the oil, add the chicken and cook through with salt, pepper and paprika.",
  "Stir in plain dry oat flakes and about 200 ml water per serving. Simmer until creamy, adding water as needed; use water rather than milk.",
  "Serve as a savory breakfast bowl. Use dairy-free seasonings and no butter or cream.",
]

