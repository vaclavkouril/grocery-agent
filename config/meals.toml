translated_steps = {en=["Cook the dry white rice in water according to its packet instructions. Peel and chop the vegetables.", "Roast the carrots and onion at 210 °C with half the oil, cumin, pepper and salt until tender.", "Slice plain chicken breast and season it with paprika and cumin. Brown in the remaining oil and cook through.", "Serve the chicken over rice with the roasted vegetables. Use dairy-free seasoning blends; no butter, cream or cheese."], cs=["Suchou bílou rýži uvařte ve vodě podle návodu na obalu. Oloupejte a nakrájejte zeleninu.","Mrkev a cibuli pečte při 210 °C s polovinou oleje, římským kmínem, pepřem a solí doměkka.","Neochucená kuřecí prsa nakrájejte a okořeňte paprikou a římským kmínem. Opečte na zbytku oleje a důkladně propečte.","Podávejte kuře s rýží a pečenou zeleninou. Používejte koření bez mléka; nepřidávejte máslo, smetanu ani sýr."]}
minutes = 35
grams = {chicken="300", rice="70", carrot="200", onion="50", oil="10"}
steps = [
  "Cook the dry white rice in water according to its packet instructions. Peel and chop the vegetables.",
  "Roast the carrots and onion at 210 °C with half the oil, cumin, pepper and salt until tender.",
  "Slice plain chicken breast and season it with paprika and cumin. Brown in the remaining oil and cook through.",
  "Serve the chicken over rice with the roasted vegetables. Use dairy-free seasoning blends; no butter, cream or cheese.",
]

