# One large serving; raw purchased grams (vegetable trimming is accounted for below).
# Nutrition: small, attributed factual records from Czech Food Composition Database.
# Recipe matches are conservative lexical suggestions, not exact product identity resolution.
[policy]
source_id = "kupi"
scope = "kupi:locality:praha"
location_label = "Praha"
timezone = "Europe/Prague"
lactose_free = true
meal_style = "main"
servings = 1
min_protein_g = "70"
max_kcal = "850"
max_cost_per_serving_czk = "100"
max_age_hours = 36
allow_loyalty = false
# Ordinary supermarket chains for this initial Praha meal profile.
retailers = ["albert", "billa", "lidl", "penny", "kaufland", "tesco", "globus"]
max_stores = 2
ranking = "protein_per_czk"
# Oil and seasonings are explicitly estimated pantry costs, not scraped prices.
seasoning_allowance_czk = "3"

# Applied when a request changes style; explicit request limits take precedence.
[style_defaults.breakfast]
min_protein_g = "35"
max_kcal = "650"
max_cost_per_serving_czk = "80"

[style_defaults.snack]
min_protein_g = "25"
max_kcal = "450"
max_cost_per_serving_czk = "60"

# Optional already-owned stock: uncomment and adjust to your actual inventory.
# Omit grams only when you have enough for any suggested dish (e.g. basic staples).
# [pantry]
# seasonings_available = true
# [pantry.items.rice]
# grams = "5000"
# [pantry.items.chicken]
# grams = "2000"
# use_first = true
# [pantry.items.oil]

