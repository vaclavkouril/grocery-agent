name: grocery-agent

x-runtime: &runtime
  build: .
  image: grocery-agent:local
  init: true
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - grocery-data:/var/lib/grocery-agent
    - ./config:/app/config:ro
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-environment: &environment
  GROCERY_SHARED_CONFIG: ${GROCERY_SHARED_CONFIG:-}
  GROCERY_CATALOGUE_MAX_AGE_HOURS: ${GROCERY_CATALOGUE_MAX_AGE_HOURS:-36}
  GROCERY_CATALOGUE_TIMEZONE: ${GROCERY_CATALOGUE_TIMEZONE:-Europe/Prague}
  GROCERY_CATALOGUE_ALLOW_CACHED_ON_FAILURE: ${GROCERY_CATALOGUE_ALLOW_CACHED_ON_FAILURE:-true}
  GROCERY_LOG_LEVEL: ${GROCERY_LOG_LEVEL:-INFO}

services:
  collector:
    <<: *runtime
    command: [collector]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *environment
      GROCERY_COLLECTOR_DAILY_AT: ${GROCERY_COLLECTOR_DAILY_AT:-02:00}
      GROCERY_COLLECTOR_TIMEZONE: ${GROCERY_COLLECTOR_TIMEZONE:-Europe/Prague}
      GROCERY_COLLECTOR_RUN_ON_STARTUP: ${GROCERY_COLLECTOR_RUN_ON_STARTUP:-true}
      GROCERY_HTTP_TIMEOUT_SECONDS: ${GROCERY_HTTP_TIMEOUT_SECONDS:-30}
      GROCERY_USER_AGENT: ${GROCERY_USER_AGENT:-grocery-agent/0.1}
      GROCERY_KUPI_MAX_PAGES: ${GROCERY_KUPI_MAX_PAGES:-100}
      GROCERY_KUPI_REQUEST_DELAY_SECONDS: ${GROCERY_KUPI_REQUEST_DELAY_SECONDS:-1}
      GROCERY_KUPI_ATTEMPTS: ${GROCERY_KUPI_ATTEMPTS:-3}

  catalogue-api:
    <<: *runtime
    command: [serve-catalogue, --host, 0.0.0.0, --port, '8000']
    restart: unless-stopped
    environment: *environment
    ports:
      - '127.0.0.1:${GROCERY_CATALOGUE_PORT:-8000}:8000'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cli:
    <<: *runtime
    profiles: [tools]
    command: [stores]
    environment: *environment

  profile-collector:
    <<: *runtime
    profiles: [acquisition]
    entrypoint: [grocery-collect]
    command: [--config, /app/config/collect.toml]
    restart: unless-stopped
    environment: *environment

  profile-scrape:
    <<: *runtime
    profiles: [tools]
    entrypoint: [grocery-scrape]
    command: [--config, /app/config/scrape.toml]
    environment: *environment

  backend:
    <<: *runtime
    profiles: [backend]
    entrypoint: [grocery-backend]
    command: [--config, /app/config/backend.toml, serve, --host, 0.0.0.0]
    restart: unless-stopped
    environment:
      <<: *environment
      GROCERY_BACKEND_PROVIDERS: ${GROCERY_BACKEND_PROVIDERS:-["template"]}
      GROCERY_BACKEND_EMAIL_ENABLED: ${GROCERY_BACKEND_EMAIL_ENABLED:-false}
      GROCERY_BACKEND_SIMPLEX_ENABLED: ${GROCERY_BACKEND_SIMPLEX_ENABLED:-false}
      GROCERY_BACKEND_EMAIL_TRANSPORT_TOKEN: ${GROCERY_BACKEND_EMAIL_TRANSPORT_TOKEN:-}
      GROCERY_BACKEND_SIMPLEX_TRANSPORT_TOKEN: ${GROCERY_BACKEND_SIMPLEX_TRANSPORT_TOKEN:-}
    ports:
      - '127.0.0.1:${GROCERY_BACKEND_PORT:-8001}:8001'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *runtime
    profiles: [backend]
    entrypoint: [grocery-backend]
    command: [--config, /app/config/backend.toml, worker]
    restart: unless-stopped
    stop_grace_period: 300s
    environment:
      <<: *environment
      GROCERY_BACKEND_PROVIDERS: ${GROCERY_BACKEND_PROVIDERS:-["template"]}

  email:
    <<: *runtime
    profiles: [email]
    entrypoint: [grocery-email]
    command: [--config, /app/config/email.toml]
    restart: unless-stopped
    environment:
      GROCERY_EMAIL_ENABLED: ${GROCERY_EMAIL_ENABLED:-false}
      GROCERY_EMAIL_API_URL: http://backend:8001
      GROCERY_EMAIL_SERVICE_TOKEN: ${GROCERY_BACKEND_EMAIL_TRANSPORT_TOKEN:-}
      GROCERY_EMAIL_INTAKE_ENABLED: ${GROCERY_EMAIL_INTAKE_ENABLED:-false}
      GROCERY_EMAIL_DELIVERY_ENABLED: ${GROCERY_EMAIL_DELIVERY_ENABLED:-false}
      GROCERY_EMAIL_IMAP_USERNAME: ${GROCERY_EMAIL_IMAP_USERNAME:-}
      GROCERY_EMAIL_IMAP_PASSWORD: ${GROCERY_EMAIL_IMAP_PASSWORD:-}
      GROCERY_EMAIL_SMTP_USERNAME: ${GROCERY_EMAIL_SMTP_USERNAME:-}
      GROCERY_EMAIL_SMTP_PASSWORD: ${GROCERY_EMAIL_SMTP_PASSWORD:-}

  simplex:
    <<: *runtime
    profiles: [simplex]
    entrypoint: [grocery-simplex]
    command: [--config, /app/config/simplex.toml]
    restart: unless-stopped
    # Linux: reach the separately operated, unauthenticated loopback SimpleX daemon.
    network_mode: host
    environment:
      GROCERY_SIMPLEX_ENABLED: ${GROCERY_SIMPLEX_ENABLED:-false}
      GROCERY_SIMPLEX_API_URL: http://127.0.0.1:${GROCERY_BACKEND_PORT:-8001}
      GROCERY_SIMPLEX_TRANSPORT_TOKEN: ${GROCERY_BACKEND_SIMPLEX_TRANSPORT_TOKEN:-}
      GROCERY_SIMPLEX_WS_URL: ${GROCERY_SIMPLEX_WS_URL:-ws://127.0.0.1:5225}
      GROCERY_SIMPLEX_USER_ID: ${GROCERY_SIMPLEX_USER_ID:-1}
      GROCERY_SIMPLEX_ALLOWED_CONTACT_IDS: ${GROCERY_SIMPLEX_ALLOWED_CONTACT_IDS:-[]}
      GROCERY_SIMPLEX_HISTORY_COUNT: ${GROCERY_SIMPLEX_HISTORY_COUNT:-50}

volumes:
  grocery-data:
