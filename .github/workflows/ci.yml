name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix src/frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose run --rm cli stores
      - run: docker compose run --rm cli scrape mock
      - run: docker compose run --rm cli catalogue mock
      - run: docker compose run --rm profile-scrape --source mock
      - run: docker compose run --rm profile-collector --once --source mock
      - run: docker compose up --no-deps -d --wait catalogue-api
      - run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused 'http://127.0.0.1:8000/health/ready?source=mock'
      - if: always()
        run: docker compose down --volumes
